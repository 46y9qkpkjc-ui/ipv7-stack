[package]
name = "ipv7-stack"
version = "0.1.0"
edition = "2021"
authors = ["Arunkumar Subbiah <arunkumar.subbiah@apexadversary.com>"]
description = "IPv7: Identity-Centric Network Protocol Stack Implementation in Rust"
license = "MIT"
repository = "https://github.com/arunkumarsubbiah/ipv7-stack"
readme = "README.md"
keywords = ["ipv7", "networking", "protocol", "security", "identity"]
categories = ["network-programming"]

[dependencies]
tokio = { version = "1.0", features = ["full"] }
bytes = "1.5"
thiserror = "1.0"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ed25519-dalek = "2.1"
sha2 = "0.10"
rand = "0.8"
clap = { version = "4.4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"

[dev-dependencies]
criterion = "0.5"

[[example]]
name = "packet_parser"
path = "examples/packet_parser.rs"

[[example]]
name = "spv_validation"
path = "examples/spv_validation.rs"

[[example]]
name = "router_demo"
path = "examples/router_demo.rs"

[profile.release]
opt-level = 3
lto = true

[lib]
name = "ipv7_stack"
path = "src/lib.rs"
